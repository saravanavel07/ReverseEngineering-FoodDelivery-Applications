version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://orangebite_user:orangebite_pass@db:5432/orangebite_db
      - SECRET_KEY=orangebite-insecure-dev-secret-key-3918239
      - DEBUG=True
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=orangebite_db
      - POSTGRES_USER=orangebite_user
      - POSTGRES_PASSWORD=orangebite_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
